<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blocked by Frozen</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center;
    justify-content: center; background: #0b0e14; color: #e6e9f0;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  .card { text-align: center; max-width: 560px; padding: 48px; }
  .mark {
    width: 64px; height: 64px; margin: 0 auto 24px; border-radius: 16px;
    background: linear-gradient(135deg, #4f8cff, #7b5cff);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; font-weight: 700; color: #fff;
  }
  h1 { font-size: 24px; font-weight: 600; margin: 0 0 8px; }
  .site {
    color: #8b93a7; font-size: 15px; word-break: break-all;
    margin: 0 0 24px; font-family: Consolas, monospace;
  }
  .meta { color: #5a6276; font-size: 13px; line-height: 1.7; }
  .meta b { color: #8b93a7; font-weight: 600; }
  .hint { margin-top: 20px; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">❄</div>
    <h1>This website is blocked</h1>
    <p class="site" id="u"></p>
    <div class="meta">
      <div>Block list: <b id="b"></b></div>
      <div>Matched rule: <b id="r"></b></div>
      <div class="hint">Go back to work.</div>
    </div>
  </div>
<script src="blocked.js"></script>
</body>
</html>
