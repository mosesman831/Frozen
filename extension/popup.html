<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; font-family: "Segoe UI", system-ui, sans-serif; }
  body { width: 316px; background: #0a0a0d; color: #e4e4e7; padding: 14px; font-size: 13px; -webkit-font-smoothing: antialiased; }
  .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .brand svg { display: block; }
  .brand h1 { font-size: 13.5px; font-weight: 650; letter-spacing: -0.01em; color: #f4f4f5; }
  .brand span { font-size: 10px; color: #63636e; letter-spacing: 0.02em; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px;
         padding: 8px 10px; background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.06);
         border-radius: 9px; margin-bottom: 6px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.02); }
  .lbl { color: #8b8b96; font-size: 12px; }
  .val { font-weight: 600; font-size: 12.5px; }
  .active { color: #4ade80; } .off { color: #71717a; } .bad { color: #f26d6d; }
  button { background: rgba(255,255,255,0.05); color: #d4d4d8; border: 1px solid rgba(255,255,255,0.08); border-radius: 7px;
           padding: 6px 10px; font-size: 12px; cursor: pointer; transition: background .12s, border-color .12s; }
  button:hover { background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.13); }
  button:active { transform: scale(0.97); }
  button.primary { background: #7c6cf0; border-color: #8b7cf5; color: #fff; }
  button.primary:hover { background: #8b7cf5; }
  button.warn { background: rgba(242,109,109,0.12); border-color: rgba(242,109,109,0.3); color: #f26d6d; }
  button:disabled { opacity: .4; cursor: default; transform: none; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .block { display: flex; align-items: center; justify-content: space-between;
           padding: 7px 10px; border: 1px solid rgba(255,255,255,0.06); background: rgba(255,255,255,0.02);
           border-radius: 8px; margin-bottom: 5px; }
  .block .nm { font-weight: 600; font-size: 12.5px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
         margin-right: 7px; background: #3f3f46; }
  .dot.on { background: #4ade80; box-shadow: 0 0 6px rgba(74,222,128,0.6); } .dot.lock { background: #fbbf24; box-shadow: 0 0 6px rgba(251,191,36,0.5); }
  .sec { color: #63636e; font-size: 10px; font-weight: 700; letter-spacing: 0.12em; margin: 12px 0 6px; }
  #err { color: #f26d6d; font-size: 12px; min-height: 16px; margin-bottom: 4px; }
  .frozen { border-color: rgba(242,109,109,0.35); }
  a { color: #a78bfa; font-size: 12px; text-decoration: none; }
  a:hover { color: #c4b5fd; }
</style>
</head>
<body>
  <div class="brand">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="2" x2="12" y2="22"/>
      <line x1="3.34" y1="7" x2="20.66" y2="17"/>
      <line x1="20.66" y1="7" x2="3.34" y2="17"/>
    </svg>
    <div>
      <h1>Frozen</h1>
      <span>distraction blocker</span>
    </div>
  </div>
  <div id="err"></div>
  <div class="row"><span class="lbl">Service</span><span class="val" id="svc">…</span></div>
  <div class="row"><span class="lbl">State</span><span class="val" id="st">…</span></div>
  <div class="row" id="frozenrow" style="display:none"><span class="lbl bad">FROZEN</span><span class="val bad" id="fzr"></span></div>
  <div class="row" id="pomorow" style="display:none"><span class="lbl">Pomodoro</span><span class="val" id="pomo"></span></div>
  <div class="sec">BLOCKS</div>
  <div id="blocks"></div>
  <div class="sec">BREAKS</div>
  <div class="btns">
    <button id="bd" title="wait 60s first">delay break</button>
    <button id="br" title="type random text">random-text break</button>
    <button id="bc" title="app/site actually needed">cause break</button>
    <button id="be">end break</button>
  </div>
  <div class="sec">GLOBAL</div>
  <div class="btns">
    <button id="pause">pause 5m</button>
    <button id="resume">resume</button>
    <a href="#" id="opts">options</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
